<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Cyber Survival DUO</title>
<style>
body { margin:0; overflow:hidden; background:#0a0f1f; color:white; font-family:Arial; }
#ui { position:fixed; top:10px; left:10px; }
#leaderboard { position:fixed; top:10px; right:10px; text-align:right; }
#gameOver {
    position:fixed; inset:0; background:#000c; display:none;
    justify-content:center; align-items:center; flex-direction:column;
}
button { padding:10px 20px; font-size:18px; margin-top:10px; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
❤️ P1 Élet: <span id="h1">100</span><br>
💛 P2 Élet: <span id="h2">100</span><br>
🧮 Pont: <span id="score">0</span>
</div>

<div id="leaderboard">
<h3>🏆 Helyi Tabella</h3>
<div id="scores"></div>
</div>

<div id="gameOver">
<h1>GAME OVER</h1>
<p>Pontszám: <span id="finalScore"></span></p>
<button onclick="restart()">Újra</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let bullets = [], enemies = [], score = 0, running = true;
let keys = {};

let p1 = { x:200, y:300, color:"#00f0ff", health:100, dir:{x:1,y:0} };
let p2 = { x:600, y:300, color:"orange", health:100, dir:{x:-1,y:0} };

function spawnEnemies(){
    setInterval(()=>{
        if(!running) return;
        enemies.push({
            x: Math.random()*canvas.width,
            y: Math.random()*canvas.height,
            size: 18,
            speed: 1+Math.random()
        });
    },1000);
}

function shoot(player){
    bullets.push({
        x:player.x,
        y:player.y,
        dx:player.dir.x*8,
        dy:player.dir.y*8
    });
}

function update(){
    if(!running) return;
    movePlayers();
    moveBullets();
    moveEnemies();
    collisions();
    draw();
    requestAnimationFrame(update);
}

function movePlayers(){
    if(keys["w"]){ p1.y-=4; p1.dir={x:0,y:-1}; }
    if(keys["s"]){ p1.y+=4; p1.dir={x:0,y:1}; }
    if(keys["a"]){ p1.x-=4; p1.dir={x:-1,y:0}; }
    if(keys["d"]){ p1.x+=4; p1.dir={x:1,y:0}; }

    if(keys["arrowup"]){ p2.y-=4; p2.dir={x:0,y:-1}; }
    if(keys["arrowdown"]){ p2.y+=4; p2.dir={x:0,y:1}; }
    if(keys["arrowleft"]){ p2.x-=4; p2.dir={x:-1,y:0}; }
    if(keys["arrowright"]){ p2.x+=4; p2.dir={x:1,y:0}; }
}

function moveBullets(){
    bullets.forEach(b=>{ b.x+=b.dx; b.y+=b.dy; });
    bullets = bullets.filter(b=>b.x>0&&b.x<canvas.width&&b.y>0&&b.y<canvas.height);
}

function moveEnemies(){
    enemies.forEach(e=>{
        const target = Math.random()<0.5 ? p1 : p2;
        const angle = Math.atan2(target.y-e.y,target.x-e.x);
        e.x += Math.cos(angle)*e.speed;
        e.y += Math.sin(angle)*e.speed;
    });
}

function collisions(){
    enemies.forEach((e,ei)=>{
        [p1,p2].forEach((p,pi)=>{
            if(Math.hypot(p.x-e.x,p.y-e.y)<25){
                p.health--;
                document.getElementById(pi===0?"h1":"h2").textContent=p.health;
                if(p.health<=0) endGame();
            }
        });

        bullets.forEach((b,bi)=>{
            if(Math.hypot(b.x-e.x,b.y-e.y)<20){
                enemies.splice(ei,1);
                bullets.splice(bi,1);
                score+=10;
                document.getElementById("score").textContent=score;
            }
        });
    });
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="red";
    enemies.forEach(e=>{
        ctx.beginPath(); ctx.arc(e.x,e.y,e.size,0,Math.PI*2); ctx.fill();
    });

    ctx.fillStyle=p1.color;
    ctx.beginPath(); ctx.arc(p1.x,p1.y,20,0,Math.PI*2); ctx.fill();

    ctx.fillStyle=p2.color;
    ctx.beginPath(); ctx.arc(p2.x,p2.y,20,0,Math.PI*2); ctx.fill();

    ctx.fillStyle="yellow";
    bullets.forEach(b=>{
        ctx.beginPath(); ctx.arc(b.x,b.y,5,0,Math.PI*2); ctx.fill();
    });
}

function endGame(){
    running=false;
    saveScore(score);
    document.getElementById("finalScore").textContent=score;
    document.getElementById("gameOver").style.display="flex";
}

function restart(){ location.reload(); }

function saveScore(s){
    let scores = JSON.parse(localStorage.getItem("duoScores")||"[]");
    scores.push(s);
    scores.sort((a,b)=>b-a);
    scores = scores.slice(0,5);
    localStorage.setItem("duoScores",JSON.stringify(scores));
    showScores();
}

function showScores(){
    let scores = JSON.parse(localStorage.getItem("duoScores")||"[]");
    document.getElementById("scores").innerHTML = scores.map(s=>"⭐ "+s).join("<br>");
}
showScores();

window.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;
    if(e.code==="Space") shoot(p1);
    if(e.code==="Enter") shoot(p2);
});
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

spawnEnemies();
update();
</script>
</body>
</html>
