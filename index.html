<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<title>Cyber Survival Online</title>

<!-- Firebase régebbi (kompatibilis) verzió -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body { margin:0; overflow:hidden; background:#0a0f1f; color:white; font-family:Arial; }
#ui { position:fixed; top:10px; left:10px; }
#leaderboard { position:fixed; top:10px; right:10px; text-align:right; }
#startScreen {
    position:fixed; inset:0; background:#000c; display:flex;
    flex-direction:column; justify-content:center; align-items:center;
}
input, button { padding:10px; font-size:18px; margin:5px; }
</style>
</head>
<body>

<div id="startScreen">
    <h1>Bencibogyó játéka</h1>
    <input id="nameInput" placeholder="Neved..." />
    <button onclick="startGame()">Játék indítása</button>
</div>

<canvas id="game"></canvas>

<div id="ui">
    ❤️ Élet: <span id="health">100</span><br>
    🧮 Pont: <span id="score">0</span>
</div>

<div id="leaderboard">
    <h3>🏆 Tabella</h3>
    <div id="scores"></div>
</div>

<script>
// 🔥 IDE ILLESZD BE A SAJÁT firebaseConfig-odat
var firebaseConfig = {
  apiKey: "IDE",
  authDomain: "IDE",
  databaseURL: "IDE",
  projectId: "IDE",
  storageBucket: "IDE",
  messagingSenderId: "IDE",
  appId: "IDE"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let playerId, playerName;
let players = {};
let enemies = [];
let health = 100;
let score = 0;
let keys = {};

function startGame() {
    playerName = document.getElementById("nameInput").value || "Játékos";
    document.getElementById("startScreen").style.display = "none";

    playerId = db.ref("players").push().key;

    db.ref("players/" + playerId).set({
        name: playerName,
        x: canvas.width/2,
        y: canvas.height/2
    });

    db.ref("players").on("value", snap => players = snap.val() || {});
    loadLeaderboard();
    spawnEnemies();
    update();
}

function spawnEnemies() {
    setInterval(() => {
        enemies.push({
            x: Math.random()*canvas.width,
            y: Math.random()*canvas.height,
            size: 18
        });
    }, 2000);
}

function update() {
    movePlayer();
    moveEnemies();
    draw();
    requestAnimationFrame(update);
}

function movePlayer() {
    const me = players[playerId];
    if (!me) return;

    if (keys["w"]) me.y -= 4;
    if (keys["s"]) me.y += 4;
    if (keys["a"]) me.x -= 4;
    if (keys["d"]) me.x += 4;

    db.ref("players/" + playerId).update({ x: me.x, y: me.y });
}

function moveEnemies() {
    const me = players[playerId];
    if (!me) return;

    enemies.forEach(e => {
        const angle = Math.atan2(me.y - e.y, me.x - e.x);
        e.x += Math.cos(angle);
        e.y += Math.sin(angle);

        if (Math.hypot(me.x - e.x, me.y - e.y) < 25) {
            health--;
            document.getElementById("health").textContent = health;
            if (health <= 0) endGame();
        }
    });
}

function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="red";
    enemies.forEach(e=>{
        ctx.beginPath(); ctx.arc(e.x,e.y,e.size,0,Math.PI*2); ctx.fill();
    });

    for (let id in players) {
        const p = players[id];
        ctx.fillStyle = id === playerId ? "#00f0ff" : "orange";
        ctx.beginPath();
        ctx.arc(p.x,p.y,20,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle="white";
        ctx.fillText(p.name, p.x-15, p.y-25);
    }
}

function endGame() {
    db.ref("scores").push({ name: playerName, score: score });
    db.ref("players/" + playerId).remove();
    alert("Vége! Pontszám: " + score);
    location.reload();
}

function loadLeaderboard() {
    db.ref("scores").limitToLast(10).on("value", snap => {
        let html="";
        snap.forEach(s=>{
            const d=s.val();
            html += `${d.name}: ${d.score}<br>`;
        });
        document.getElementById("scores").innerHTML=html;
    });
}

window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);
</script>
</body>
</html>
